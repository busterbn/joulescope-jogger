# Temporary override used only to validate the stack on the Pi without
# clashing with the natively-installed InfluxDB (8086) and Grafana (3000).
# !override replaces the base port list instead of appending to it.
services:
  influxdb:
    ports: !override
      - "18086:8086"
  grafana:
    ports: !override
      - "13000:3000"
